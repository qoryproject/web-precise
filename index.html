<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRECISE Precision 1.0</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading" class="loading"><div class="spinner-border text-primary"></div><p>Memuat PRECISE…</p></div>

  <div id="login" class="loading d-none"><form class="card-x" style="max-width:360px;width:calc(100% - 32px);height:auto" onsubmit="doLogin(event)">
    <h1 class="h4 mb-1">PRECISE Precision 1.0</h1><p class="small mb-3" style="color:var(--tx2)">Log masuk untuk teruskan</p>
    <p id="loginMsg" class="small" style="color:var(--err)" role="alert"></p>
    <label class="form-label" for="l-email">E-mel</label><input id="l-email" type="email" class="form-control mb-2" autocomplete="username" required>
    <label class="form-label" for="l-pin">PIN</label><input id="l-pin" type="password" inputmode="numeric" minlength="6" class="form-control mb-3" autocomplete="current-password" required>
    <button class="btn-pri w-100">Log Masuk</button></form></div>

  <nav id="sidebar" class="sidebar d-none d-lg-flex">
    <div class="brand"><span class="logo">P</span><div><b>PRECISE</b><small>Precision 1.0</small></div></div>
    <ul id="sideNav" class="side-nav"></ul>
    <div class="side-foot"><span class="dot"></span> GSheets Sync <span class="mono ms-auto">ONLINE</span></div>
  </nav>

  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">Papan Pemuka</h1>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span id="who" class="who"></span>
        <button class="btn btn-ghost" onclick="load(false,true)" aria-label="Segarkan data"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="btn btn-ghost" onclick="logout()" aria-label="Log keluar"><i class="bi bi-box-arrow-right"></i></button>
        <button class="btn btn-ghost" onclick="toggleTheme()" aria-label="Tukar mod gelap/terang"><i class="bi bi-moon-stars"></i></button>
      </div>
    </header>

    <section id="s-dash" class="page"></section>
    <section id="s-stok" class="page"></section>
    <section id="s-masuk" class="page"></section>
    <section id="s-keluar" class="page"></section>
    <section id="s-audit" class="page"></section>
  </main>

  <nav id="bottomNav" class="bottom-nav d-lg-none"></nav>

  <div id="scanModal" class="scan-modal" role="dialog" aria-label="Imbas barkod">
    <div class="scan-box"><div class="d-flex justify-content-between align-items-center mb-2"><b>Imbas Barkod</b><button class="btn-ghost" onclick="closeScan()" aria-label="Tutup"><i class="bi bi-x-lg"></i></button></div>
      <div id="reader"></div><div id="reader-tmp" style="display:none"></div><p id="scanMsg" class="small mt-2"></p>
      <div id="scanFileBox" class="d-none"><input type="file" accept="image/*" capture="environment" class="form-control" onchange="scanPhoto(this)"></div></div></div>
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toast" class="toast" role="alert"><div class="toast-body" id="toastBody"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
